<h2><span id=".E7.AE.80.E4.BB.8B"></span><span class="mw-headline" id="简介">简介</span></h2>
<p>叠加指的是在没有任何<a href="%E9%87%8C%E4%B8%96%E7%95%8C.html" class="mw-redirect" title="幻境">幻境</a>背景的情况下进行描绘，也就是说，你在你现实中看到的东西之上描绘他们。
</p><p>叠加的图像不会像<a href="%E6%8A%95%E5%BD%B1.html" title="投影">投影</a>那样覆盖感官感受。
