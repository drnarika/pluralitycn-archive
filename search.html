<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索 - 多意识体中文百科离线存档</title>
<link rel="stylesheet" href="_mw_/site.styles.css">
<link rel="stylesheet" href="_mw_/skins.citizen.codex.styles.css">
<link rel="stylesheet" href="_mw_/skins.citizen.tokens.css">
<link rel="stylesheet" href="_mw_/skins.citizen.styles.css">
<link rel="stylesheet" href="_res_/archive.css">
</head>
<body>
<div class="pw-navbar"><a class="pw-brand" href="index.html">多意识体中文百科 · 离线存档</a><a href="search.html">搜索</a><a href="README.html">存档说明</a></div>
<main class="pw-page pw-search">
<h1>全文搜索</h1>
<p><input id="q" type="search" placeholder="输入关键词，回车搜索" autofocus></p>
<p id="stat" class="pw-status">正在载入索引…</p>
<div id="out"></div>
</main>
<script>
var docs = null;
fetch('search-data.json').then(function (r) { return r.json() }).then(function (d) {
  docs = d;
  document.getElementById('stat').textContent = '索引已就绪，共 ' + d.length + ' 个条目。';
}).catch(function (e) {
  document.getElementById('stat').textContent = '索引载入失败：' + e;
});

function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c] }) }

function snippet(text, q) {
  var i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text.slice(0, 180));
  var a = Math.max(0, i - 60), b = Math.min(text.length, i + q.length + 120);
  return (a > 0 ? '…' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) +
    '</mark>' + esc(text.slice(i + q.length, b)) + (b < text.length ? '…' : '');
}

function run() {
  if (!docs) { setTimeout(run, 200); return }
  var q = document.getElementById('q').value.trim();
  var out = document.getElementById('out'), st = document.getElementById('stat');
  if (!q) { out.innerHTML = ''; st.textContent = '索引已就绪，共 ' + docs.length + ' 个条目。'; return }
  var ql = q.toLowerCase(), hits = [];
  for (var i = 0; i < docs.length; i++) {
    var d = docs[i], ti = d.t.toLowerCase().indexOf(ql), xi = d.x.toLowerCase().indexOf(ql);
    if (ti < 0 && xi < 0) continue;
    var n = 0, x = d.x.toLowerCase(), p = 0;
    while ((p = x.indexOf(ql, p)) >= 0) { n++; p += ql.length; if (n > 50) break }
    hits.push({ d: d, score: n + (ti >= 0 ? 500 : 0) + (d.t === q ? 1000 : 0) });
  }
  hits.sort(function (a, b) { return b.score - a.score });
  st.textContent = hits.length
    ? '“' + q + '” 命中 ' + hits.length + ' 个条目，显示前 ' + Math.min(hits.length, 25) + ' 个'
    : '“' + q + '” 没有命中条目';
  out.innerHTML = hits.slice(0, 25).map(function (h) {
    return '<div class="pw-hit"><a href="' + encodeURI(h.d.u) + '">' + esc(h.d.t) + '</a>' +
      '<div class="pw-snippet">' + snippet(h.d.x, q) + '</div></div>';
  }).join('');
}
document.getElementById('q').addEventListener('input', run);
document.getElementById('q').addEventListener('keyup', run);
</script>
</body>
</html>
