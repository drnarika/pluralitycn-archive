        <div id="mw-content-text" class="mw-body-content mw-content-ltr" lang="zh-Hans-CN" dir="ltr"><div class="mw-content-ltr mw-parser-output" lang="zh-Hans-CN" dir="ltr"><h2><span id=".E5.90.8C.E4.B9.89.E8.AF.8D"></span><span class="mw-headline" id="同义词">同义词</span></h2>
<p>Creator，Host，宿主
</p>
<h2><span id=".E5.AE.9A.E4.B9.89"></span><span class="mw-headline" id="定义">定义</span></h2>
<p>创造者是指<a href="%E7%B3%BB%E7%BB%9F.html" title="系统">系统</a>内<a href="%E5%A1%91%E9%80%A0.html" title="塑造">创造</a>其他意识体的<a href="%E6%84%8F%E8%AF%86%E4%BD%93.html" title="意识体">意识体</a>。
</p>
<h2><span id=".E7.AE.80.E4.BB.8B"></span><span class="mw-headline" id="简介">简介</span></h2>
