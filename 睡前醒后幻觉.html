      <div id="bodyContent">

        <div id="mw-content-text" class="mw-body-content mw-content-ltr" lang="zh-Hans-CN" dir="ltr"><div class="mw-content-ltr mw-parser-output" lang="zh-Hans-CN" dir="ltr"><h2><span id=".E5.AE.9A.E4.B9.89"></span><span class="mw-headline" id="定义">定义</span></h2>
<p>在不清醒的时候，通常为睡前和醒后的一段时间，感知到的幻觉。
</p>
<h2><span id=".E7.AE.80.E4.BB.8B"></span><span class="mw-headline" id="简介">简介</span></h2>
<p>睡前醒后幻觉是一种常见现象，但是很少有对其的描述。
</p><p>在医学上主要与<a href="%E7%B2%BE%E7%A5%9E%E5%88%86%E8%A3%82.html" title="精神分裂">精神分裂症</a>的幻觉症状相区分。
</p></div><div id="catlinks" class="catlinks" data-mw="interface"><div id="mw-normal-catlinks" class="mw-normal-catlinks">分类：​<ul><li><a href="%E5%88%86%E7%B1%BB/%E5%8C%BB%E5%AD%A6.html" title="分类:医学">医学</a></li></ul></div></div><!--htdig_noindex--><div><div class="zim-footer">
